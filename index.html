<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>喫煙所号車ナビ</title>
  <meta name="description" content="新幹線の乗車前・降車後に、駅の喫煙所へ最短で行ける号車を探して指定席予約をサポートします。">
  <meta name="theme-color" content="#0f5c8c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>喫煙所号車ナビ</h1>
    <p class="lede">東海道・山陽・九州・東北・北海道・秋田・山形・上越・北陸新幹線で、乗車前・降車後に駅の喫煙所へ近い号車を探します。</p>
    <nav class="tabs" aria-label="画面切替">
      <a href="#search" class="tab" data-tab="search">号車を探す</a>
      <a href="#stations" class="tab" data-tab="stations">駅の喫煙所一覧</a>
    </nav>
  </header>

  <main>
    <section id="view-search" class="view" aria-labelledby="search-title">
      <h2 id="search-title" class="visually-hidden">号車を探す</h2>
      <form id="search-form" class="card form">
        <div class="row">
          <label>路線
            <select name="line"></select>
          </label>
        </div>
        <div class="route">
          <label>乗車駅
            <select name="from" required></select>
          </label>
          <button type="button" class="swap" id="swap" aria-label="乗車駅と降車駅を入れ替え">⇄</button>
          <label>降車駅
            <select name="to" required></select>
          </label>
        </div>
        <div class="row">
          <label>列車
            <select name="train"></select>
          </label>
          <label>座席
            <select name="seat">
              <option value="reserved">普通車指定席</option>
              <option value="green">グリーン車</option>
              <option value="granclass">グランクラス</option>
              <option value="unreserved">自由席</option>
              <option value="any">すべて</option>
            </select>
          </label>
        </div>
        <fieldset class="checks">
          <legend>吸いたいタイミング</legend>
          <label><input type="checkbox" name="before" checked> 乗車前</label>
          <label><input type="checkbox" name="after" checked> 降車後</label>
        </fieldset>
      </form>

      <div id="result" aria-live="polite"></div>
    </section>

    <section id="view-stations" class="view" hidden aria-labelledby="stations-title">
      <h2 id="stations-title">駅の喫煙所一覧</h2>
      <div id="station-list"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>喫煙所は改札営業時間中のみ利用できます。設置状況は変わることがあるため、駅の掲示・公式情報もご確認ください。</p>
    <p id="data-updated"></p>
    <p><a href="https://github.com/innouenosuke123-code/shinkansen_kitsuenjyo_smart_transit/issues/new?title=%E5%96%AB%E7%85%99%E6%89%80%E6%83%85%E5%A0%B1%E3%81%AE%E8%A8%82%E6%AD%A3" target="_blank" rel="noopener">情報の誤り・廃止を報告する</a></p>
  </footer>

  <template id="tpl-error"><p class="card error"></p></template>
  <script type="module" src="src/app.js"></script>
</body>
</html>
